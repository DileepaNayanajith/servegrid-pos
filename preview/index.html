<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#16263c" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <title>BATA KADE | Touchscreen POS Preview</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
  <link rel="stylesheet" href="./style.css?v=compact-1" />
</head>
<body>
  <div class="app-shell">
    <header class="app-header">
      <div class="brand" title="BATA KADE POS • Touch &amp; keyboard ordering">
        <div class="brand-mark">BK</div>
        <div class="brand-name">BATA KADE <span>POS</span></div>
      </div>
      <div id="demo-banner" class="demo-pill-head" title="Owner menu updated 17 Nov 2026. DEMO only — no real orders or payments.">
        <span class="demo-dot" aria-hidden="true"></span><strong>DEMO</strong><span class="demo-text">No real orders or payments</span>
        <button id="banner-owner" type="button">How to test</button>
      </div>

      <div class="head-controls">
        <div class="seg meal-switch" role="group" aria-label="Meal menu (කෑම වේල)">
          <button class="seg-btn meal-btn active" data-meal="breakfast" aria-pressed="true"><span aria-hidden="true">☀</span> Breakfast</button>
          <button class="seg-btn meal-btn" data-meal="lunch" aria-pressed="false"><span aria-hidden="true">◉</span> Lunch</button>
          <button class="seg-btn meal-btn" data-meal="dinner" aria-pressed="false"><span aria-hidden="true">☾</span> Dinner</button>
        </div>
        <div class="seg service-switch" role="group" aria-label="Order type (F2)">
          <button class="seg-btn service-btn active" data-service="Takeaway" aria-pressed="true">Takeaway</button>
          <button class="seg-btn service-btn" data-service="Dine-in" aria-pressed="false">Dine-in</button>
        </div>
        <div id="table-area" class="table-number hidden"><label for="table-no">Table</label><input id="table-no" type="text" inputmode="numeric" maxlength="10" placeholder="No." /></div>
      </div>

      <div class="header-actions">
        <span class="local-indicator" hidden></span>
        <span id="clock" class="clock">--:--</span>
        <button class="header-button" id="open-orders" title="Previous orders"><span aria-hidden="true">▤</span> <span class="hb-label">Orders</span></button>
        <button class="header-button" id="open-owner" title="How to test this preview"><span aria-hidden="true">ⓘ</span> <span class="hb-label">Help</span></button>
      </div>
    </header>

    <main class="workspace">
      <section class="catalog" aria-label="Food selection">
        <div class="catalog-top">
          <div class="search-row">
            <form id="code-form" class="code-form" autocomplete="off" role="search">
              <div class="search-field">
                <span class="search-icon" aria-hidden="true">⌕</span>
                <input id="code-input" type="text" inputmode="text" placeholder="Code or name — 101, 2*111, kottu" aria-label="Food code, quantity times code, or food name" aria-describedby="search-status" spellcheck="false" />
                <button type="button" id="clear-search" class="clear-search" aria-label="Clear search and category" title="Clear search (Esc)"><span aria-hidden="true">✕</span><span class="clear-label">Clear</span></button>
              </div>
              <button type="submit" class="add-code-button" title="Add code (Enter)">Add <kbd>↵</kbd></button>
            </form>
            <div class="quick-extras" aria-label="Quick picks"><span class="quick-extras-title">Quick</span><div id="quick-extras-buttons" class="quick-extras-buttons"></div></div>
          </div>
          <nav id="category-filters" class="category-filters" aria-label="Food categories"></nav>
          <div class="status-line">
            <div class="feedback-line" id="feedback" aria-live="polite">Loading menu…</div>
            <div id="search-status" class="search-status" role="status" aria-live="polite"></div>
          </div>
        </div>
        <div id="menu-scroll" class="menu-scroll">
          <div id="menu-groups"></div>
        </div>
      </section>

      <aside class="bill-panel" id="bill-panel" aria-label="Current bill">
        <div class="bill-head">
          <div class="bill-title"><h2>Current bill</h2><span id="bill-mode" class="bill-mode">• Takeaway</span></div>
          <button class="undo-button" id="undo-button" disabled title="Undo last change">↶ Undo</button>
        </div>
        <div id="bill-items" class="bill-items"><div class="empty-cart"><div class="empty-icon">▤</div><strong>No food added yet</strong><span>කෑමක් තෝරන්න</span></div></div>
        <div class="bill-summary">
          <div class="summary-counts"><span id="bill-units">0 items</span><span id="bill-lines">0 types</span></div>
          <div class="total-row"><div class="total-label">TOTAL<small>මුළු මුදල</small></div><div id="bill-total" class="total-number">Rs. 0</div></div>
        </div>
        <div class="pay-section">
          <div class="payment-tabs" role="group" aria-label="Payment method">
            <button class="payment-btn active" data-payment="Cash">Cash</button>
            <button class="payment-btn" data-payment="Card">Card</button>
            <button class="payment-btn" data-payment="QR">QR</button>
          </div>
          <div id="cash-box" class="cash-box">
            <div class="cash-top">
              <label for="cash-received" class="sr-only">Cash received (Rs.)</label>
              <input id="cash-received" type="number" min="0" step="1" placeholder="Cash received (F8)" inputmode="numeric" />
              <button id="exact-cash" class="exact-btn" type="button">EXACT</button>
            </div>
            <div class="cash-presets"><button data-tender="500">500</button><button data-tender="1000">1,000</button><button data-tender="2000">2,000</button><button data-tender="5000">5,000</button></div>
            <div class="change-line"><span>Balance to give</span><strong id="change-amount">Rs. 0</strong></div>
          </div>
          <div id="external-warning" class="external-warning hidden">Demo only: Card / QR selection simulates checkout. No payment is processed.</div>
          <div class="checkout-row">
            <button class="cancel-btn" id="cancel-btn" title="Clear current order">✕ <span>Clear</span></button>
            <button class="complete-btn" id="complete-btn" disabled>✓ TRY DEMO CHECKOUT <span>→</span></button>
          </div>
        </div>
      </aside>
    </main>

    <button type="button" id="mobile-bill-bar" class="mobile-bill-bar" aria-controls="bill-panel"><span id="mobile-bill-count">0 items</span><strong id="mobile-bill-total">Rs. 0</strong><span class="mbb-go">Bill ↓</span></button>
  </div>

  <div id="modal-backdrop" class="modal-backdrop hidden" role="presentation"><div id="modal-content" class="modal" role="dialog" aria-modal="true" aria-label="Dialog"></div></div>
  <div id="toast" class="toast hidden" role="status"></div>
  <script src="./demo-api.js?v=owner-menu-1" defer></script>
  <script src="./app.js?v=compact-1" defer></script>
</body>
</html>
