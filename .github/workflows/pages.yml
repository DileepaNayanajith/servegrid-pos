name: Deploy BATA KADE preview to Pages

on:
  push:
    branches: [client/bata-kade]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bata-kade-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/client/bata-kade'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview
      - name: Deploy preview
        id: deployment
        uses: actions/deploy-pages@v4
